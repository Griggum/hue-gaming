name: Test, scan and publish Pi image

on:
  pull_request:
  push:
    # Validate branch pushes too; only master/version tags can publish.
    branches: ["**"]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.9.25 pip-audit==2.10.1
          uv sync --frozen --extra gaming --extra server --group dev
      - name: Lint and test
        run: |
          uv run --no-sync ruff check src tests
          uv run --no-sync pytest -q
          node --check src/hue_portal/static/app.js
      - name: Audit server dependencies
        run: |
          uv export --frozen --no-dev --extra server --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/server-requirements.txt"
          pip-audit --disable-pip --no-deps --require-hashes -r "$RUNNER_TEMP/server-requirements.txt"

  image:
    needs: verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build ARM64 candidate locally
        run: |
          docker build --pull --platform linux/arm64 \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag hue-portal:scan .
      - name: Scan OS and Python vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: hue-portal:scan
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          version: v0.69.3
          cache: false
          timeout: 10m
      - name: Scan image for secrets at all severities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: hue-portal:scan
          scanners: secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '1'
          version: v0.69.3
          skip-setup-trivy: true
          cache: false
      - name: Verify image contents and run with restricted permissions
        run: |
          test "$(docker image inspect hue-portal:scan --format '{{.Config.User}}')" = '10001:10001'
          docker run --rm --entrypoint python hue-portal:scan -c 'import importlib.util; from pathlib import Path; import hue_portal.app; assert importlib.util.find_spec("rapidocr_onnxruntime") is None; assert importlib.util.find_spec("mss") is None; assert not list(Path("/app").rglob(".env")); assert not Path("/app/.git").exists(); assert not list(Path("/data").iterdir())'
          docker run -d --name hue-smoke --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /data:rw,uid=10001,gid=10001,mode=0700 \
            -e HUE_PORTAL_TOKEN=ci-only-disposable-smoke-test-token \
            -p 127.0.0.1:8080:8080 hue-portal:scan
          trap 'docker rm -f hue-smoke >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/readyz; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/readyz
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api/library)" = 401
          curl --fail --silent -H 'Authorization: Bearer ci-only-disposable-smoke-test-token' \
            http://127.0.0.1:8080/api/library > /dev/null
      - name: Save the scanned candidate
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        run: docker save hue-portal:scan --output "$RUNNER_TEMP/hue-portal.tar"
      - name: Transfer candidate to publication job
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        id: candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scanned-image
          path: ${{ runner.temp }}/hue-portal.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: image
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download this run's scanned candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.image.outputs.artifact-id }}
          path: ${{ runner.temp }}/candidate
          merge-multiple: true
      - name: Load scanned image
        run: docker load --input "$RUNNER_TEMP/candidate/hue-portal.tar"
      - name: Publish the scanned image to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          docker tag hue-portal:scan "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            docker tag hue-portal:scan "$IMAGE:$GITHUB_REF_NAME"
            docker push "$IMAGE:$GITHUB_REF_NAME"
          fi
          printf 'Published ARM64 image: `%s:sha-%s`\n' "$IMAGE" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
