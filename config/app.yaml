# Paths are resolved relative to this file.
profiles: profiles.yaml
# Optional local cache pulled from the Pi by hue-sync. Never contacts Pi during gameplay.
profile_cache: profiles.cache.json
lighting:
  brightness: 1.0
  intensity: 1.0
  speed: 1.0
  # Optional per-position trim, multiplied by master brightness.
  channel_brightness: {}
lights: lights.yaml
env_file: ../.env
log_file: ../logs/wow-hue.log
bridge:
  host: null
  # Use the Hue CA bundle and the Bridge ID as its TLS certificate name.
  # See docs/PI_PORTAL.md for certificate provisioning; paths here are relative.
  ca_file: null
  bridge_id: null
  request_interval_seconds: 0.25
  timeout_seconds: 5
  max_retry_seconds: 30
