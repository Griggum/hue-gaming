[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wow-hue"
version = "0.1.0"
description = "Curated, local Philips Hue ambience for World of Warcraft"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<0.29",
    "mss>=10,<11",
    "pillow>=11,<13",
    "psutil>=7,<8",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
    "rapidocr-onnxruntime==1.4.4",
]

[project.scripts]
wow-hue = "wow_hue.main:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

