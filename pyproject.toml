[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wow-hue"
version = "0.1.0"
description = "Direct-to-Hue gaming clients and a Raspberry Pi profile portal"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<0.29",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
gaming = ["mss>=10,<11", "pillow>=11,<13", "psutil>=7,<8", "rapidocr-onnxruntime==1.4.4"]
server = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.scripts]
wow-hue = "wow_hue.main:main"
valheim-hue = "hue_games.cli:valheim_main"
hue-game = "hue_games.cli:main"
hue-client = "hue_games.client:main"
hue-sync = "hue_core.sync:main"
hue-import-wow = "wow_hue.library:main"
hue-portal = "hue_portal.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wow_hue", "src/hue_core", "src/hue_portal", "src/hue_capture", "src/hue_games"]

[dependency-groups]
dev = [
    "cryptography>=46,<49",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

